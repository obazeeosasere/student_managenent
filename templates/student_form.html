{% extends "base.html" %}

{% block title %}
    {% if student %}
        Edit Student
    {% else %}
        Add Student
    {% endif %}
{% endblock %}

{% block content %}

    <h1>
        {% if student %}
            Edit Student
        {% else %}
            Add Student
        {% endif %}
    </h1>

    <form method="POST">

        <label for="first_name">First Name</label>
        <input
            type="text"
            id="first_name"
            name="first_name"
            value="{{ student.first_name if student else '' }}"
            required
        >

        <label for="last_name">Last Name</label>
        <input
            type="text"
            id="last_name"
            name="last_name"
            value="{{ student.last_name if student else '' }}"
            required
        >

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            value="{{ student.email if student else '' }}"
        >

        <label for="date_of_birth">Date of Birth</label>
        <input
            type="date"
            id="date_of_birth"
            name="date_of_birth"
            value="{{ student.date_of_birth if student else '' }}"
        >

        <label for="class_name">Class</label>
        <input
            type="text"
            id="class_name"
            name="class_name"
            value="{{ student.class_name if student else '' }}"
            required
        >

        <button type="submit">
            {% if student %}
                Update Student
            {% else %}
                Add Student
            {% endif %}
        </button>

    </form>

{% endblock %}
